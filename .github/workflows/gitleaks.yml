name: gitleaks

# Secret scan for every push and pull request.
#
# The scanner is pinned to an exact gitleaks release and verified against the
# release's own SHA-256 checksums before it runs, so a compromised or moved
# download cannot silently execute. The job fails (exit 1) when a leak is
# found, both across the complete git history and in the checked-out tree.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (full history + tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks from a verified release
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -sSfL -o "$work/gitleaks_${version}_linux_x64.tar.gz" \
            "$base/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "$work/checksums.txt" "$base/gitleaks_${version}_checksums.txt"
          (cd "$work" && sha256sum -c checksums.txt --ignore-missing)
          tar -xzf "$work/gitleaks_${version}_linux_x64.tar.gz" -C "$work" gitleaks
          install "$work/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the complete git history
        run: gitleaks git --no-banner --redact --platform github .

      - name: Scan the working tree
        run: gitleaks dir --no-banner --redact .
