name: linux-tests

# The plugin itself is Linux-testable (Windows-only detection is injected in
# unit tests), so every push also runs the main node:test suite and the Linux
# Web-host E2E here. windows-smoke covers the real-Windows half.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Linux unit + Web E2E (DSH ${{ matrix.dsh-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every declared compatible release must be proven independently; one
      # failing DSH version must not hide the results of the others.
      fail-fast: false
      matrix:
        dsh-version: ['0.2.2-rc.1', '0.2.2-rc.2', '0.2.2-rc.3']
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Cache npm downloads for the global DSH install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-dsh-${{ matrix.dsh-version }}-Linux

      - name: Install DSH ${{ matrix.dsh-version }}
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh-version }}
          dsh --version

      - name: Unit tests (node:test)
        run: node --test test/*.test.mjs

      - name: Linux Web host end-to-end smoke
        run: bash test/e2e.sh
