name: windows-smoke

# Real Windows verification without owning a Windows machine.
#
# Runs on a GitHub-hosted windows-latest runner (Windows Server with Git for
# Windows preinstalled) and drives the actual composition:
#   - installs DSH 0.2.2-rc.1 from npm,
#   - runs the Windows-only live tests (real Git Bash detection + real command
#     execution through the private executor + BASH_ENV),
#   - composes a Web profile with this plugin and boots the real Web host,
#     then checks /dsh-gitbash-win/status, the client bundle graph, and the
#     unauthenticated rejection on Windows,
#   - probes the official ACL sandbox + Git Bash combination as a BLOCKING gate
#     (confined-ok / fail-closed / acl-incompatible pass; UNEXPECTED fails the
#     job). The probe never weakens policy: unconfined execution is refused.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: Windows live smoke (Git Bash + Web host)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Cache npm downloads for the global DSH install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/AppData/Local/npm-cache
          key: npm-dsh-0.2.2-rc.1-${{ runner.os }}

      - name: Install DSH 0.2.2-rc.1
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1
          dsh --version

      - name: Verify Git for Windows is available
        shell: bash
        run: |
          set -euo pipefail
          bash_exe='/c/Program Files/Git/bin/bash.exe'
          test -f "$bash_exe"
          "$bash_exe" -c 'uname -s'

      - name: Windows live executor tests (detection, spawn, BASH_ENV)
        shell: bash
        run: node --test test/windows-live.test.mjs

      - name: Install playwright-core for the settings-card browser test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1

      - name: Windows Web host end-to-end smoke (incl. Edge settings-card test)
        shell: bash
        env:
          BROWSER_CARD: '1'
        run: bash test/e2e-windows.sh

      - name: Upload the browser-card failure screenshot
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-card-failure
          path: browser-card-failure.png
          if-no-files-found: ignore
          retention-days: 3

      - name: ACL sandbox probe (fails the job on an unexpected result)
        shell: bash
        run: node test/windows-sandbox-probe.mjs
